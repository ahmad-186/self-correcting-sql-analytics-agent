[project]
name = "ai-sql-analytics-agent"
version = "0.1.0"
description = "Production-grade self-correcting Natural Language SQL & Analytics Agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ahmad Shahzad" }
]

dependencies = [
    "langgraph>=0.6.0",
    "langchain>=0.3.0",
    "langchain-mistralai>=0.3.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.11",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1",
    "pandas>=2.3",
    "plotly>=6.0",
    "sqlglot>=27.0",
    "pytest>=8.4",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# 👇 ADD THIS LINE TO FIX THE ERROR
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]